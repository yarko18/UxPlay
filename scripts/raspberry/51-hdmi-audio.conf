# Raspberry Pi home receiver: expose the KMS HDMI ALSA profile even when no
# UCM description is installed, and keep the legacy analogue jack out of the
# desktop audio graph. ALSA card 0 remains the direct HDMI default as well.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.platform-3f902000.hdmi"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-ucm = false
      }
    }
  }
  {
    matches = [
      {
        device.name = "alsa_card.platform-3f00b840.mailbox"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
